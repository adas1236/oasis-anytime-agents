[experiment]
name = "oasis-500-row-grid"
data_root = "../../data"
datasets = ["max_coverage", "minimum_facility", "tsp"]
rows_per_dataset = 500
seed = 42

# One shard gives 27 logical Pods. Increase this only when a condition needs to
# be split across multiple Pods to meet a deadline; all budget cells retain the
# identical ordered 500-row sample.
shards_per_condition = 1
time_budgets = ["30s", "60s", "unlimited"]
token_budgets = ["2k", "8k", "unlimited"]

model_type = "transformers"
profile = "gemma4_e2b_it"
dtype = "bfloat16"
quantization = "none"
attention_backend = "sdpa"
thinking = true
max_generated_tokens = 768
max_tool_rounds = 4
max_tool_calls = "unlimited"
model_call_timeout = "unlimited"
tsp_tolerance_km = 1.0
osrm_endpoint = "https://router.project-osrm.org"
osrm_cache_only = false

[runpod]
# Build and push this exact image name before launching. Make the GHCR package
# public, or set container_registry_auth_id below for a private package.
image = "ghcr.io/adas1236/oasis-anytime-agents:runpod-eval-v1"

# Use exactly one GPU type for controlled timing comparisons. Multiple entries
# mean acceptable alternatives chosen for availability, not heterogeneous GPUs.
gpu_types = ["NVIDIA GeForce RTX 5090"]
gpu_count = 1
cloud_type = "SECURE"
interruptible = false
container_disk_gb = 60
volume_disk_gb = 40
volume_mount_path = "/workspace"
network_volume_id = ""
# Set this only for a private container registry configured in Runpod.
container_registry_auth_id = ""
min_vcpu_per_gpu = 4
min_ram_per_gpu_gb = 16

[runpod.env]
# Create this as a Runpod secret after accepting the Gemma license on the same
# Hugging Face account. Never paste a real token into this tracked file.
HF_TOKEN = "{{ RUNPOD_SECRET_hf_token }}"
AWS_ACCESS_KEY_ID = "{{ RUNPOD_SECRET_aws_access_key_id }}"
AWS_SECRET_ACCESS_KEY = "{{ RUNPOD_SECRET_aws_secret_access_key }}"
AWS_DEFAULT_REGION = "us-east-2"

[artifacts]
local_root = "/workspace/oasis-results"

# Strongly recommended for parallel jobs. Any S3-compatible service works; set
# AWS credentials as Runpod-secret references in [runpod.env]. An empty value
# leaves results on the Pod/network volume and prevents automatic off-Pod backup.
s3_uri = "s3://oasis-anytime-agent/oasis-anytime-agents"
upload_interval_seconds = 60
