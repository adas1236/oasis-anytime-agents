name: Build Runpod evaluation image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: GHCR tag used by infra/runpod/experiment.toml
        required: true
        default: runpod-eval-v1
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Runpod image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/runpod/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/oasis-anytime-agents:${{ inputs.image_tag }}
            ghcr.io/${{ github.repository_owner }}/oasis-anytime-agents:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
