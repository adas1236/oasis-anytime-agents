name: Build Runpod evaluation image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: GHCR tag used by infra/runpod/experiment.toml
        required: true
        default: runpod-eval-v4
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Runpod image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/runpod/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/oasis-anytime-agents:${{ inputs.image_tag }}
            ghcr.io/${{ github.repository_owner }}/oasis-anytime-agents:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record immutable image reference
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/oasis-anytime-agents:${{ inputs.image_tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Published Runpod image"
            echo
            echo "- Tag: \`${IMAGE}\`"
            echo "- Digest: \`${DIGEST}\`"
            echo
            echo '```text'
            docker buildx imagetools inspect "${IMAGE}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
