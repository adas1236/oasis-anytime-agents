[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oasis-anytime-agents"
version = "0.1.0"
description = "Budget-aware GeoAI agents for public-health spatial equity"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "OASIS contributors" }]
dependencies = [
  "fastapi>=0.116,<1",
  "geopandas>=1.1,<2",
  "httpx>=0.28,<1",
  "jsonschema>=4.25,<5",
  "networkx>=3.5,<4",
  "numpy>=2.3,<3",
  "ortools>=9.14,<10",
  "pandas>=2.3,<3",
  "pillow>=11.3,<13",
  "pyarrow>=21,<23",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "pyproj>=3.7,<4",
  "rasterio>=1.4,<2",
  "scipy>=1.16,<2",
  "shapely>=2.1,<3",
  "sse-starlette>=3,<4",
  "tenacity>=9.1,<10",
  "transformers>=5.10.1,<6",
  "uvicorn>=0.35,<1",
]

[project.scripts]
oasis = "oasis.cli:main"
oasis-runpod = "oasis.runpod_experiments:main"

[project.optional-dependencies]
# The sharing adapter uses Gradio's internal tunnel helper; pin its tested API.
share = ["gradio==6.13.0"]

[dependency-groups]
# uv cannot install CPU and CUDA PyTorch wheels in one environment. Keep CPU as
# the default group so a bare `uv sync` remains the safe, complete V1 setup.
cpu = [
  "accelerate>=1.10,<2",
  "torch>=2.8,<3",
  "torchvision>=0.23,<1",
]
gpu = [
  "accelerate>=1.10,<2",
  "torch>=2.8,<3",
  "torchvision>=0.23,<1",
]
runpod = [
  "boto3>=1.40,<2",
]
dev = [
  "hypothesis>=6.138,<7",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
  "types-jsonschema>=4.25,<5",
]

[tool.uv]
cache-dir = ".uv-cache"
conflicts = [
  [
    { group = "cpu" },
    { group = "gpu" },
  ],
]
default-groups = ["cpu", "dev"]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", group = "gpu" },
  { index = "pytorch-cpu", group = "cpu" },
]
torchvision = [
  { index = "pytorch-cu128", group = "gpu" },
  { index = "pytorch-cpu", group = "cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/oasis"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = [
  "geopandas.*",
  "networkx.*",
  "pandas.*",
  "pyarrow.*",
  "rasterio.*",
  "scipy.*",
  "shapely.*",
  "torch.*",
  "transformers.*",
  "boto3.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "network: requires access to an external network endpoint (opt in)",
  "model: downloads or loads real model weights (opt in)",
  "gpu: initializes one CUDA device (opt in)",
  "multi_gpu: initializes multiple accelerator devices (opt in)",
  "slow: exceeds the normal unit-test latency budget (opt in)",
]
